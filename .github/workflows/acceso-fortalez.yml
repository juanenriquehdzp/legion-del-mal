name: 🌋Acceso a la fortaleza prohibida

on: push

jobs:
  acceso-a-la-base:
    runs-on: ubuntu-latest

    steps:
    - name: El agente llega a la fortaleza
      run: |
        echo " El agente ${{ github.actor }} llega a la fortaleza"
        echo " "
        echo "Buscar los archivos de la legión"
        ls -la
        echo " "
        echo "❌ ¿pero qué pasó? no hay nada"

    - name: "Brainiac desbloque la bóveda"
      uses: actions/checkout@v4

    - name: "Ahora sí, vamos a ver los planes"
      run: |
        echo "Buscar los archivos de la legión"
        ls -la
        echo "✅ Funciona!!!"
        echo " "
        echo "Planes"
        ls planes/
        echo "Villanos"
        ls villanos/
        echo "Inteligencia"
        ls inteligencia/