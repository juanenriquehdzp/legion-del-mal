# This is a basic workflow to help you get started with Actions

name: Comunicador de la legión


on:
  workflow_dispatch:
    inputs:
      Villano:
        descripcion: "¿Que villano envía el mensaje?"
        required: True
        type: choice
        options:
          - Brainiac
          - Lex Luthor
          - Joker
          - Darkseid
          - Sinestro

      Mensaje:
        descripcion: "Mensaje para el consejo"
        required: True
        type: string
        default: "La misión fue un éxito"

      Prioridad:
        descripcion: "Nivel de prioridad"
        required: True
        type: choice
        options:
          - 🟢 Normal
          - 🟡 Alta
          - 🔴 Crítica


jobs:
  Transmitir-mensaje:

    runs-on: ubuntu-latest

    steps:
      - name: Imprimir inputs
        run: |
          echo "Inputs: "
          echo ""
          echo "Villano: ${{ inputs.Villano }}"
          echo "Nivel: ${{ inputs.Prioridad}}"
          echo "Mensaje: ${{ inputs.Mensaje}}"  
