# This is a basic workflow to help you get started with Actions

name: Comunicador de la legión


on:
  workflow_dispatch:
    inputs:
      Villano:
        descripcion: "¿Que villano envía el mensaje?"
        required: True
        type: choice
        options:
          - Brainiac
          - Lex Luthor
          - Joker
          - Darkseid
          - Sinestro

      Mensaje:
        descripcion: "Mensaje para el consejo"
        required: True
        type: string
        default: "La misión fue un éxito"

      Cow_character:
        descripcion: "Personaje"
        required: True
        type: choice
        options:
          - eyes
          - tux
          - dragon
          - ghostbusters
          - cheese
          - king

      Prioridad:
        descripcion: "Nivel de prioridad"
        required: True
        type: choice
        options:
          - 🟢 Normal
          - 🟡 Alta
          - 🔴 Crítica


jobs:
  Transmitir-mensaje:

    runs-on: ubuntu-latest

    steps:

      - name: Instalar el transmisor de la legion
        run: sudo apt-get install -y cowsay

      - name: Imprimir inputs
        run: |
          echo "================================"
          echo "   Transmnisión interceptada    "
          echo "================================"
          echo ""
          echo "De: ${{ inputs.Villano}}"
          echo ""
          echo "Fecha de transmisión: $(date -u +"%d-%m-%Y - %H:%M:%S UTC")"
          echo "----------- Mensaje -------------"
          cowsay -f eyes "${{ inputs.Mensaje}}"
          echo ""
          echo "---- ${{ inputs.Villano }} ----"
          echo "..."